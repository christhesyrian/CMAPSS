[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmapps-telemetry-anomaly-detection"
version = "0.1.0"
description = "CMAPSS telemetry anomaly detection and remaining useful life (RUL) prediction pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "pyyaml",
  "pyarrow",
  "joblib",
  "kaggle",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cmapps-tad = "cmapps_telemetry_anomaly_detection.cli:main"